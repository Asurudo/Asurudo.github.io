<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asurudo</title>
<link href="/css/style.css" rel="stylesheet">
</head>
<body>

<div id="mainnav">
  <div class="container"><a href="/">Asurudo</a></div>
</div>

<div class="container">
<div class="row">

  <!-- ============ 左侧栏 ============ -->
  <div class="sidebar">

    <div class="sidebaritem" id="headshot">
      <!-- 换成照片：<img src="/img/me.jpg"/>  文件放 img/me.jpg -->
      <div class="photo-placeholder">PHOTO</div>
    </div>

    <div class="sidebaritem" id="affiliations">
      <div class="sidebarheader">Affiliations</div>
      <div class="tbd">TBD</div>
    </div>

    <div class="sidebaritem" id="contactinfo">
      <div class="sidebarheader">Contact</div>
      <div><a href="mailto:asurudojyo@gmail.com">asurudojyo@gmail.com</a></div>
      <div><a href="https://github.com/Asurudo" target="_blank" rel="noopener">github.com/Asurudo</a></div>
    </div>

  </div>

  <!-- ============ 右侧主体 ============ -->
  <div class="maincontent">

    <div class="mainitem" id="about">
      <div class="mainheader">About</div>
      <p class="tbd">TBD —— 一段自我介绍：你是谁、在哪、做什么方向、教育背景。</p>
    </div>

    <div class="mainitem" id="publications">
      <div class="mainheader">Publications</div>

      <div class="pub">
        <div class="pubimagesection">
          <div class="thumb-placeholder">thumbnail</div>
        </div>
        <div class="pubtextsection">
          <div class="pubtitle tbd">论文标题 TBD</div>
          <div class="pubauthors tbd">作者列表 TBD</div>
          <div class="pubvenue tbd">会议 / 期刊，年份 TBD</div>
        </div>
      </div>

      <div class="pub">
        <div class="pubimagesection">
          <div class="thumb-placeholder">thumbnail</div>
        </div>
        <div class="pubtextsection">
          <div class="pubtitle tbd">论文标题 TBD</div>
          <div class="pubauthors tbd">作者列表 TBD</div>
          <div class="pubvenue tbd">会议 / 期刊，年份 TBD</div>
        </div>
      </div>

    </div>

    <div class="mainitem" id="projects">
      <div class="mainheader">Projects</div>

      <div class="project">
        <div class="projimagesection">
          <div class="thumb-placeholder">thumbnail</div>
        </div>
        <div class="projtextsection">
          <div class="projtitle tbd">项目名 TBD</div>
          <div class="projintro tbd">一两句话介绍：做了什么、用了什么技术、结果如何。</div>
        </div>
      </div>

    </div>

  </div>

</div>
</div>

</body>
</html>
